# ============================================================
# 企业级 CI/CD 流水线示例（GitHub Actions）
#
# 流程：push master → 构建镜像 → 推送 Docker Hub → SSH 部署服务器
#
# 使用前需在 GitHub 仓库 Settings → Secrets 配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（不是登录密码）
#   SERVER_HOST         服务器 IP
#   SERVER_USER         服务器 SSH 用户名（如 root）
#   SERVER_SSH_KEY      服务器 SSH 私钥（整段复制）
# ============================================================

name: CI/CD Pipeline

# 触发条件：push 到 master 分支就跑
on:
  push:
    branches: [master]

jobs:
  # ---------- 阶段一：CI 构建并推送镜像 ----------
  build-and-push:
    name: 构建镜像并推送仓库
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码到构建机
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 buildx（Docker 的高级构建工具，支持缓存加速）
      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录 Docker Hub（凭证从 Secrets 读取，不会明文出现在代码里）
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 构建并推送后端镜像
      #    同时打两个 tag：latest（最新）和 commit 哈希（可精确回滚）
      - name: 构建推送 server 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/blog-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/blog-server:buildcache,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-server:${{ github.sha }}

      # 5. 构建并推送前端镜像
      - name: 构建推送 client 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/blog-client:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/blog-client:buildcache,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-client:${{ github.sha }}

  # ---------- 阶段二：CD 部署到生产服务器 ----------
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build-and-push # 必须等镜像推送成功才执行
    steps:
      # 通过 SSH 登录服务器，拉新镜像并重启容器
      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/blog
            docker compose pull
            docker compose up -d
            docker image prune -f   # 清理旧镜像释放磁盘
