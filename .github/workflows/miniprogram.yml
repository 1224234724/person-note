name: 小程序 CI — 上传开发版本

on:
  push:
    branches: [master]
    paths:
      - 'miniprogram/**'
      - '.github/workflows/miniprogram.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 miniprogram-ci
        run: npm install -g miniprogram-ci

      - name: 还原上传密钥
        run: |
          echo "${{ secrets.WX_UPLOAD_KEY_BASE64 }}" | base64 -d > /tmp/wx_upload.key

      - name: 上传到微信开发版本
        run: |
          miniprogram-ci upload \
            --pp miniprogram \
            --pkp /tmp/wx_upload.key \
            --appid wx4ea3864702b0d83b \
            --uv "1.0.${{ github.run_number }}" \
            --desc "Auto upload from GitHub Actions — ${{ github.sha }}" \
            -r 1
